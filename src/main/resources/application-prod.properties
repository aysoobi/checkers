# Railway sets PORT; locally defaults to 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Railway PostgreSQL plugin injects PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:checkers}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
